<!doctype html>
<html lang="en"${htmlClass}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>${description}
    <link rel="stylesheet" href="/styles.css">
    <link rel="me" href="https://github.com/yvg">
    <link rel="me" href="https://indieweb.social/@yvg">
    <link rel="webmention" href="https://webmention.io/yves.vg/webmention">${meta}
    <script>
      // Blocking on purpose: a saved choice has to land before the first
      // paint, or the page flashes the other theme. No saved choice means no
      // attribute, which leaves prefers-color-scheme in charge.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
  </head>

  <body>
${nav}

    <main>
${main}
    </main>

${footer}

    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.getElementById("theme-toggle");
        if (!toggle) return;

        var system = window.matchMedia("(prefers-color-scheme: dark)");

        var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.6M12 19.6v2.6M4.8 4.8l1.9 1.9M17.3 17.3l1.9 1.9M1.8 12h2.6M19.6 12h2.6M4.8 19.2l1.9-1.9M17.3 6.7l1.9-1.9"/></svg>';
        var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></svg>';

        // No stored choice means the system decides, so read it from there.
        function isDark() {
          return root.dataset.theme ? root.dataset.theme === "dark" : system.matches;
        }

        function render() {
          var dark = isDark();
          var label = dark ? "Switch to the light theme" : "Switch to the dark theme";
          toggle.innerHTML = dark ? SUN : MOON;
          toggle.setAttribute("aria-label", label);
          toggle.setAttribute("title", label);
        }

        toggle.addEventListener("click", function () {
          var next = isDark() ? "light" : "dark";
          root.dataset.theme = next;
          try { localStorage.setItem("theme", next); } catch (e) {}
          render();
        });

        // Follow the system while the reader has not overridden it.
        system.addEventListener("change", function () {
          if (!root.dataset.theme) render();
        });

        toggle.hidden = false;
        render();
      })();

      // The nav hides as you scroll down and comes back as soon as you scroll
      // up. Marking it live is what switches the sticky styles on, so a page
      // without JS keeps the plain nav at the top.
      (function () {
        var nav = document.querySelector("nav");
        if (!nav) return;

        // Movement smaller than this is trackpad jitter, not intent. The
        // reference point only moves once it is exceeded, so a slow scroll
        // still adds up instead of never hiding the bar.
        var DELTA = 8;
        var lastY = window.pageYOffset;
        var navHeight = nav.offsetHeight;
        var ticking = false;

        function update() {
          ticking = false;
          var max = document.documentElement.scrollHeight - window.innerHeight;
          // Clamp: overscroll at either end bounces back and would otherwise
          // read as a scroll in the opposite direction.
          var y = Math.max(0, Math.min(window.pageYOffset, max));

          nav.classList.toggle("is-stuck", y > 0);

          if (y <= 0) {
            nav.classList.remove("is-hidden");
          } else if (y > lastY + DELTA && y > navHeight) {
            nav.classList.add("is-hidden");
          } else if (y < lastY - DELTA) {
            nav.classList.remove("is-hidden");
          }

          if (Math.abs(y - lastY) > DELTA) lastY = y;
        }

        window.addEventListener("scroll", function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(update);
        }, { passive: true });

        window.addEventListener("resize", function () {
          navHeight = nav.offsetHeight;
        }, { passive: true });

        // Tabbing into a hidden nav brings it back.
        nav.addEventListener("focusin", function () {
          nav.classList.remove("is-hidden");
        });

        nav.classList.add("is-live");
        update();
      })();
    </script>
  </body>
</html>
