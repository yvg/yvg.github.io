name: Build the site and publish as HTML
on: push
permissions:
  contents: write

# Shared with the webmention refresh. Both push, so they must not race.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: "20.11.0"

      - name: Install dependencies
        run: npm install

      - name: Build the site
        run: npm run build

      # The build is idempotent, so most pushes leave nothing to commit and an
      # unguarded `git commit` would fail the job.
      - name: Commit and push if anything changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "generated HTML files from sources"
          git push
